<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nexus Chat | 2026</title>
	<link rel="icon" href="data:,">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-color: #050505;
			--glass-bg: rgba(20, 20, 25, 0.6);
			--glass-border: rgba(255, 255, 255, 0.08);
			--primary: #6366f1;
			--primary-hover: #4f46e5;
			--secondary: #ec4899;
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
			--success: #10b981;
			--danger: #ef4444;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body { 
			font-family: 'Outfit', sans-serif; 
			background-color: var(--bg-color); 
			color: var(--text-main); 
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			position: relative;
			overflow-x: hidden;
		}

		/* Background Effects */
		.bg-glow {
			position: absolute;
			width: 600px;
			height: 600px;
			background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(0,0,0,0) 70%);
			top: -200px;
			left: -200px;
			z-index: -1;
			border-radius: 50%;
			filter: blur(60px);
			animation: pulse 10s infinite alternate;
		}
		
		.bg-glow.secondary {
			background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, rgba(0,0,0,0) 70%);
			top: auto;
			bottom: -100px;
			right: -200px;
			left: auto;
			animation-delay: -5s;
		}

		@keyframes pulse {
			0% { transform: scale(1); opacity: 0.8; }
			100% { transform: scale(1.2); opacity: 1; }
		}

		main.chat-container { 
			width: 100%;
			max-width: 800px; 
			margin: 2rem auto; 
			background: var(--glass-bg);
			backdrop-filter: blur(24px);
			-webkit-backdrop-filter: blur(24px);
			border: 1px solid var(--glass-border);
			border-radius: 24px;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
			display: flex;
			flex-direction: column;
			height: calc(100vh - 4rem - 60px); /* Leave space for log */
			min-height: 500px;
			overflow: hidden;
		}

		/* Header */
		.chat-header {
			padding: 1.5rem 2rem;
			border-bottom: 1px solid var(--glass-border);
			display: flex;
			justify-content: space-between;
			align-items: center;
			flex-wrap: wrap;
			gap: 1rem;
			background: rgba(0,0,0,0.2);
		}

		.header-title {
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.logo {
			width: 32px;
			height: 32px;
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			border-radius: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
		}

		h1 { 
			font-size: 1.5rem; 
			font-weight: 600;
			background: linear-gradient(to right, #fff, #a5b4fc);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.connection-panel {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		input { 
			padding: 0.75rem 1rem; 
			background: rgba(0,0,0,0.4);
			border: 1px solid var(--glass-border); 
			border-radius: 12px; 
			color: #fff;
			font-family: inherit;
			font-size: 0.95rem;
			outline: none;
			transition: all 0.3s ease;
		}

		input:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 2px rgba(99,102,241,0.2);
		}

		input::placeholder { color: var(--text-muted); }

		button { 
			padding: 0.75rem 1.25rem; 
			border: 0; 
			border-radius: 12px; 
			font-weight: 500;
			font-family: inherit;
			cursor: pointer; 
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.btn-primary {
			background: linear-gradient(135deg, var(--primary), #818cf8);
			color: white;
			box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
		}

		.btn-primary:hover:not(:disabled) {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
		}

		.btn-secondary {
			background: rgba(255,255,255,0.1);
			color: var(--text-main);
			border: 1px solid var(--glass-border);
		}

		.btn-secondary:hover:not(:disabled) {
			background: rgba(255,255,255,0.15);
		}

		button:disabled, input:disabled { 
			opacity: 0.5; 
			cursor: not-allowed; 
			transform: none !important;
			box-shadow: none !important;
		}

		.status-indicator {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			background: rgba(0,0,0,0.3);
			padding: 0.5rem 1rem;
			border-radius: 20px;
			border: 1px solid var(--glass-border);
		}

		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			box-shadow: 0 0 10px currentColor;
		}

		.status-text {
			font-size: 0.85rem;
			font-weight: 500;
		}

		.status-text.on, .status-dot.on { color: var(--success); }
		.status-text.off, .status-dot.off { color: var(--danger); }

		/* Chat Body */
		.chat-body {
			flex: 1;
			overflow-y: auto;
			padding: 2rem;
			display: flex;
			flex-direction: column;
		}

		/* Custom Scrollbar */
		.chat-body::-webkit-scrollbar { width: 6px; }
		.chat-body::-webkit-scrollbar-track { background: transparent; }
		.chat-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
		.chat-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

		.messages-list { 
			list-style: none; 
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		.message-wrapper {
			display: flex;
			flex-direction: column;
			max-width: 75%;
			animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		}

		@keyframes slideUp {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.message-wrapper.mine {
			align-self: flex-end;
		}

		.message-wrapper.other {
			align-self: flex-start;
		}

		.sender-name {
			font-size: 0.75rem;
			color: var(--text-muted);
			margin-bottom: 0.3rem;
			margin-left: 0.5rem;
		}

		.message-wrapper.mine .sender-name {
			text-align: right;
			margin-right: 0.5rem;
		}

		.message-bubble {
			padding: 0.85rem 1.25rem;
			border-radius: 18px;
			font-size: 0.95rem;
			line-height: 1.5;
			position: relative;
			word-break: break-word;
		}

		.message-wrapper.mine .message-bubble {
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			color: white;
			border-bottom-right-radius: 4px;
			box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
		}

		.message-wrapper.other .message-bubble {
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid var(--glass-border);
			border-bottom-left-radius: 4px;
		}

		/* Form */
		.message-form {
			display: flex;
			padding: 1.5rem 2rem;
			gap: 1rem;
			border-top: 1px solid var(--glass-border);
			background: rgba(0,0,0,0.2);
		}

		.message-form input {
			flex: 1;
			padding: 1rem 1.5rem;
			border-radius: 16px;
			font-size: 1rem;
		}

		.btn-send {
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			color: white;
			width: 52px;
			height: 52px;
			border-radius: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
		}

		.btn-send svg {
			width: 20px;
			height: 20px;
			margin-right: 2px;
			margin-bottom: 2px;
		}

		.btn-send:hover:not(:disabled) {
			transform: scale(1.05);
			box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
		}

		/* Log Container */
		.log-container {
			width: 100%;
			max-width: 800px;
			margin-bottom: 2rem;
			background: var(--glass-bg);
			border: 1px solid var(--glass-border);
			border-radius: 12px;
			overflow: hidden;
		}

		details summary {
			padding: 1rem;
			cursor: pointer;
			font-weight: 500;
			color: var(--text-muted);
			user-select: none;
			background: rgba(0,0,0,0.2);
		}

		details[open] summary {
			border-bottom: 1px solid var(--glass-border);
		}

		#log { 
			list-style: none; 
			padding: 1rem; 
			margin: 0; 
			font-family: ui-monospace, 'Cascadia Code', monospace; 
			font-size: 0.8rem; 
			color: var(--text-muted);
			max-height: 150px;
			overflow-y: auto;
		}
		
		#log li { margin-bottom: 0.25rem; }

		#log::-webkit-scrollbar { width: 4px; }
		#log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

		@media (max-width: 768px) {
			.chat-header { flex-direction: column; align-items: flex-start; }
			.connection-panel { width: 100%; justify-content: space-between; }
			.btn-group { display: flex; flex: 1; gap: 0.5rem; }
			.btn-group button { flex: 1; padding: 0.75rem; }
			.status-indicator { margin-left: auto; }
			main.chat-container { margin: 1rem; height: calc(100vh - 2rem - 60px); }
			.message-form { padding: 1rem; }
			.chat-body { padding: 1rem; }
		}
	</style>
</head>
<body>
	<div class="bg-glow"></div>
	<div class="bg-glow secondary"></div>

	<main class="chat-container">
		<header class="chat-header">
			<div class="header-title">
				<div class="logo">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
				</div>
				<h1>Nexus Chat</h1>
			</div>

			<div class="connection-panel">
				<input id="sender" type="text" placeholder="Pseudo" autocomplete="off">
				<div class="btn-group">
					<button id="connectBtn" class="btn-primary" type="button">Connexion</button>
					<button id="disconnectBtn" class="btn-secondary" type="button" disabled>Déconnexion</button>
				</div>
				<div class="status-indicator">
					<span id="statusDot" class="status-dot off"></span>
					<span id="status" class="status-text off">Déconnecté</span>
				</div>
			</div>
		</header>

		<div class="chat-body" id="chatBody">
			<ul id="messages" class="messages-list"></ul>
		</div>

		<form id="messageForm" class="message-form">
			<input id="messageInput" type="text" placeholder="Écrivez votre message..." autocomplete="off" disabled>
			<button id="sendBtn" class="btn-send" type="submit" disabled>
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
			</button>
		</form>
	</main>

	<div class="log-container">
		<details>
			<summary>Journal Système STOMP</summary>
			<ul id="log"></ul>
		</details>
	</div>

	<!-- 1. Client STOMP -->
	<script src="/webjars/stomp__stompjs/bundles/stomp.umd.min.js"></script>
	<!-- 2. Notre script -->
	<script src="/js/app.js"></script>
</body>
</html>
